services:
  postgres:
    image: postgres:16-alpine
    container_name: opportunity-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: opportunity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: opportunity-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

  krown-dex-backend-service:
    build: .
    image: ${CONTAINER_NAME:-krown-dex-backend}-img:${GIT_COMMIT_HASH:-latest}
    container_name: ${CONTAINER_NAME:-krown-dex-backend}
    restart: always
    tty: true

    ports:
      - "${PORT:-5001}:5001"

    networks:
      - app-network

    env_file: .env
    environment:
      APP_VERSION: "${GIT_COMMIT_HASH:-latest}"
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
